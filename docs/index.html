<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频分析报告</title>
<style>
  /* 夜间为默认；:root[data-theme="light"] 覆盖同一批变量切成白天。
     所有颜色都必须走变量——写死一个 #hex 就等于在白天模式里挖一个坑。 */
  :root{
    --bg:#0b0e14; --bg2:#090c12; --panel:#141926; --panel-b:#121722; --panel2:#1a2131;
    --ink:#e9edf5; --ink-soft:#cbd3e2; --muted:#9aa5bb;
    --line:#232b3d; --line2:#2d3a55; --brand:#5b9dff; --brand2:#8f7ff8;
    --good:#3ddc97; --warn:#f6b73c; --bad:#ff6b7a; --mid:#f0c14b;
    --chip:#1b2233; --radius:16px; --maxw:1200px;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px -16px rgba(0,0,0,.55);
    --serif:"Georgia","Songti SC",serif;
    --glow1:rgba(91,157,255,.10); --glow2:rgba(143,127,248,.09);
    --bar:rgba(11,14,20,.92); --cap-bg:rgba(13,17,25,.95);
    --hl:rgba(246,183,60,.34);
    --brand-soft:rgba(91,157,255,.12); --brand-line:rgba(91,157,255,.42);
    --brand-wash:rgba(91,157,255,.14); --brand-wash2:rgba(91,157,255,.03);
  }
  :root[data-theme="light"]{
    --bg:#f6f8fc; --bg2:#ffffff; --panel:#ffffff; --panel-b:#f5f7fb; --panel2:#eef1f8;
    --ink:#141a24; --ink-soft:#2c3543; --muted:#5f6a7d;
    --line:#e3e8f0; --line2:#ccd4e2; --brand:#2563eb; --brand2:#6d4df6;
    --chip:#eef1f8;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 12px 32px -18px rgba(16,24,40,.28);
    --glow1:rgba(37,99,235,.07); --glow2:rgba(109,77,246,.06);
    --bar:rgba(255,255,255,.92); --cap-bg:rgba(255,255,255,.96);
    --hl:rgba(250,196,42,.45);
    --brand-soft:rgba(37,99,235,.09); --brand-line:rgba(37,99,235,.34);
    --brand-wash:rgba(37,99,235,.10); --brand-wash2:rgba(37,99,235,.02);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;color:var(--ink);padding-bottom:84px;
    background:
      radial-gradient(1400px 500px at 15% -8%,var(--glow1),transparent 60%),
      radial-gradient(1100px 420px at 90% -12%,var(--glow2),transparent 60%),
      linear-gradient(180deg,var(--bg2),var(--bg) 340px);
    background-attachment:fixed;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.72;font-size:15.5px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body.no-audio{padding-bottom:24px}
  a{color:var(--brand);text-decoration:none}
  a:hover{text-decoration:underline}
  ::selection{background:rgba(91,157,255,.30)}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
  .layout{display:grid;grid-template-columns:248px 1fr;gap:40px;align-items:start}
  @media(max-width:900px){.layout{grid-template-columns:1fr}.toc{position:static!important;max-height:none!important}}

  header.hero{padding:52px 0 30px;border-bottom:1px solid var(--line);margin-bottom:34px}
  .kicker{color:var(--brand);font-weight:800;letter-spacing:.22em;text-transform:uppercase;font-size:11.5px}
  h1{font-size:clamp(26px,3.6vw,34px);margin:10px 0 6px;line-height:1.18;font-weight:800;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:15px}
  .meta{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}
  .pill{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:12.5px;color:var(--muted)}
  .pill b{color:var(--ink);font-weight:650}

  .toc{position:sticky;top:18px;background:linear-gradient(180deg,var(--panel),var(--panel-b));border:1px solid var(--line);border-radius:var(--radius);padding:16px 12px;max-height:calc(100vh - 36px);overflow:auto;box-shadow:var(--shadow)}
  .toc::-webkit-scrollbar{width:4px}
  .toc::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
  .toc .tt{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding:4px 12px 10px}
  .toc a{display:flex;gap:10px;align-items:baseline;color:var(--muted);padding:7px 12px;border-radius:10px;font-size:13.5px;transition:.16s;border-left:2px solid transparent}
  .toc a:hover{background:var(--panel2);color:var(--ink);text-decoration:none}
  .toc a.active{background:linear-gradient(90deg,var(--brand-wash),var(--brand-wash2));color:var(--ink);border-left-color:var(--brand)}
  .toc a .n{color:var(--brand);font-variant-numeric:tabular-nums;font-size:11.5px;min-width:17px;font-weight:700;opacity:.85}
  .toc a .score{font-variant-numeric:tabular-nums;margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}

  section{margin:0 0 52px;scroll-margin-top:24px}
  h2{font-size:22px;margin:0 0 6px;display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:-.01em}
  h2 .idx{color:var(--brand);font-size:12.5px;font-weight:800;border:1px solid var(--line2);border-radius:9px;padding:3px 9px;background:linear-gradient(180deg,var(--panel2),var(--panel));font-variant-numeric:tabular-nums;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
  .lead{color:var(--muted);margin:0 0 20px;font-size:14.5px;max-width:72ch}
  h3{font-size:16px;margin:0 0 10px;font-weight:750}

  .card{background:linear-gradient(180deg,var(--panel),var(--panel-b));border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin:16px 0;box-shadow:var(--shadow)}
  .callout{background:linear-gradient(120deg,rgba(143,127,248,.13),rgba(91,157,255,.07));border:1px solid rgba(143,127,248,.32);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow)}

  /* 原文/译文：非中文原文用衬线斜体，中文译文跟在下面 */
  .en{font-style:italic;color:var(--ink-soft);font-family:var(--serif);letter-spacing:.005em}
  .zh{color:var(--muted);font-size:.94em;margin-top:3px}

  /* 重点标黄：数据里写 ==这样== 就会被渲染成荧光笔划过的效果。
     用背景渐变而不是实心底色——压住半截字，像笔划过，不像色块贴上去。 */
  mark.hl{background:linear-gradient(180deg,transparent 52%,var(--hl) 52%);
    color:inherit;font-weight:680;padding:0 1px;border-radius:2px}
  .zh mark.hl,.lead mark.hl{font-weight:650}

  /* 主题开关：右上角固定，打印时消失 */
  #theme{position:fixed;top:16px;right:18px;z-index:70;display:inline-flex;align-items:center;gap:7px;
    background:var(--panel2);border:1px solid var(--line2);color:var(--muted);border-radius:999px;
    padding:7px 14px;font-size:12.5px;font-weight:750;cursor:pointer;font-family:inherit;
    box-shadow:var(--shadow);transition:.16s}
  #theme:hover{color:var(--ink);border-color:var(--brand)}
  @media(max-width:900px){#theme{top:10px;right:10px;padding:6px 11px}}

  .topics{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .topic{font-size:12px;padding:4px 12px;border-radius:999px;color:var(--brand2);
    border:1px solid rgba(143,127,248,.35);background:rgba(143,127,248,.10);font-weight:650}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
  @media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}
  .stat{background:linear-gradient(180deg,var(--panel),var(--panel-b));border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
  .stat .num{font-size:29px;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .stat .cap{color:var(--muted);font-size:12px;margin-top:3px}

  /* 核心观点 */
  .vp{margin-top:16px}
  .vphead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .vphead .n{color:var(--brand);font-size:12.5px;font-weight:800;border:1px solid var(--line2);border-radius:9px;
    padding:2px 9px;background:linear-gradient(180deg,var(--panel2),var(--panel));font-variant-numeric:tabular-nums}
  .vphead .t{font-size:16.5px;font-weight:750;flex:1;min-width:200px}
  .vpbody{margin:10px 0 0;font-size:14.5px}
  .quote{border-left:3px solid var(--brand);background:var(--panel2);padding:10px 15px;border-radius:0 10px 10px 0;margin:14px 0 0;font-size:13.5px;color:var(--ink-soft)}
  .quote .qhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}

  /* 章节时间轴 */
  .tl{position:relative;margin:10px 0 0;padding-left:22px}
  .tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,var(--line2),var(--line))}
  .ev{position:relative;padding:9px 0 9px 16px}
  .ev::before{content:"";position:absolute;left:-21px;top:17px;width:11px;height:11px;border-radius:50%;background:var(--brand);border:2.5px solid var(--bg);box-shadow:0 0 0 2px rgba(91,157,255,.25)}
  .ev .h{font-weight:650;margin:1px 0 2px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .ev .d{color:var(--muted);font-size:13px}
  .ev .rng{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}

  /* 逐段精读 */
  .seg{display:grid;grid-template-columns:118px 1fr;gap:18px;padding:20px 2px;border-top:1px solid var(--line)}
  .seg:first-child{border-top:0}
  .seg-t{font-variant-numeric:tabular-nums;align-self:start;position:sticky;top:16px;line-height:1.9}
  .seg-t .rng{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
  .seg-topic{font-weight:750;font-size:15.5px;margin-bottom:10px}
  .seg-row{font-size:13.5px;margin:7px 0;line-height:1.7}
  .seg-row .k{font-weight:750;color:var(--muted)}
  .seg-row.q{background:rgba(143,127,248,.08);border:1px solid rgba(143,127,248,.22);border-radius:10px;padding:8px 12px}
  .seg-row.q .k{color:var(--brand2)}
  @media(max-width:640px){.seg{grid-template-columns:1fr;gap:8px}.seg-t{position:static}}

  /* 金句 */
  .gq{background:linear-gradient(180deg,var(--panel),var(--panel-b));border:1px solid var(--line);border-left:3px solid var(--brand2);border-radius:0 12px 12px 0;padding:14px 18px;margin:12px 0;box-shadow:var(--shadow)}
  .gq .big{font-size:15.5px;line-height:1.75}
  .gq .foot{margin-top:9px}

  /* 完整转写 */
  .tsbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 12px}
  .tswrap{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:var(--radius);
    background:linear-gradient(180deg,var(--panel),var(--panel-b));box-shadow:var(--shadow)}
  .tswrap::-webkit-scrollbar{width:6px}
  .tswrap::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
  .row{display:grid;grid-template-columns:70px 1fr;gap:14px;padding:9px 18px;border-top:1px solid var(--line);transition:background .15s}
  .row:first-child{border-top:0}
  .row:hover{background:rgba(91,157,255,.05)}
  .row.active{background:linear-gradient(90deg,var(--brand-wash),var(--brand-wash2));box-shadow:inset 2px 0 0 var(--brand)}
  .row .tm{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;cursor:pointer;padding-top:2px}
  .row .tm:hover{color:var(--brand)}
  .row .tx{font-size:14px}
  body.no-audio .row .tm{cursor:default}

  /* 播放按钮 */
  .pb{display:inline-flex;align-items:center;gap:5px;background:var(--brand-soft);
    border:1px solid var(--brand-line);color:var(--brand);border-radius:999px;
    padding:2px 10px;font-size:12px;font-weight:750;font-variant-numeric:tabular-nums;
    cursor:pointer;transition:.15s;font-family:inherit;line-height:1.5;vertical-align:baseline}
  .pb::before{content:"\25B6";font-size:8.5px;transform:translateY(-.5px)}
  .pb:hover{background:rgba(91,157,255,.28);transform:translateY(-1px)}
  .pb.playing{background:var(--brand);color:#fff;border-color:var(--brand)}
  .pb.playing::before{content:"\25AE\25AE";letter-spacing:-2px;font-size:8px}
  .seg-t .pb{font-size:12.5px;padding:4px 11px}
  body.no-audio .pb{cursor:default;opacity:.75}
  body.no-audio .pb::before{content:"";margin:0}
  body.no-audio .pb:hover{background:var(--brand-soft);transform:none}

  /* 底部播放条 + 实时字幕 */
  #playerbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--bar);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-top:1px solid var(--line2);padding:10px 22px;display:flex;align-items:center;gap:16px;
    box-shadow:0 -8px 24px -12px rgba(0,0,0,.6)}
  #playerbar .pt{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
  #playerbar .pt b{color:var(--ink);font-weight:650}
  #playerbar audio{flex:1;height:38px;min-width:200px}
  @media(max-width:640px){#playerbar .pt{display:none}}
  .ccbtn{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line2);
    color:var(--muted);border-radius:999px;padding:5px 13px;font-size:12px;font-weight:750;cursor:pointer;
    font-family:inherit;white-space:nowrap;transition:.15s}
  .ccbtn:hover{color:var(--ink);border-color:var(--brand)}
  .ccbtn[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand)}
  .ccbtn .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.45}
  .ccbtn[aria-pressed="true"] .dot{opacity:1;box-shadow:0 0 6px currentColor}
  #capbar{position:fixed;left:0;right:0;bottom:66px;z-index:59;display:none;justify-content:center;padding:0 22px;pointer-events:none}
  #capbar.on{display:flex}
  #cap{background:var(--cap-bg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border:1px solid var(--line2);border-left:3px solid var(--brand);border-radius:12px;
    padding:9px 18px;max-width:880px;font-size:15px;line-height:1.62;text-align:center;color:var(--ink);
    box-shadow:0 -4px 22px -10px rgba(0,0,0,.7);transition:opacity .12s}
  #cap:empty{opacity:0}
  #cap .cts{color:var(--brand);font-size:11.5px;font-variant-numeric:tabular-nums;font-weight:750;margin-right:9px;opacity:.8}
  #cap .zh{text-align:center;margin-top:2px}
  @media(max-width:640px){#cap{font-size:13.5px;padding:8px 13px}}

  footer{border-top:1px solid var(--line);margin-top:36px;padding:24px 0 40px;color:var(--muted);font-size:12.5px;line-height:1.8}

  @media print{
    body{background:#fff;color:#111;padding-bottom:0}

<script>
(function(){
  var D = window.REPORT_DATA || {};
  var M = D.meta || {};
  var hasAudio = !!D.audio;
  if(!hasAudio) document.body.classList.add('no-audio');
  var isZh = (M.lang || 'zh').slice(0,2) === 'zh';

  /* ---------- 基础工具 ---------- */
  function el(tag, cls, text){
    var n = document.createElement(tag);
    if(cls) n.className = cls;
    if(text != null) n.textContent = text;
    return n;
  }
  /* ==重点== → <mark class="hl">重点</mark>。整段用 DOM 节点拼出来，全程不碰
     innerHTML，所以数据里出现尖括号也只是普通文字，注入不了标签。 */
  var HL = /==([^=]+)==/g;
  function fill(node, text){
    text = String(text);
    if(text.indexOf('==') < 0){ node.textContent = text; return node; }
    var last = 0, m;
    HL.lastIndex = 0;
    while((m = HL.exec(text)) !== null){
      if(m.index > last) node.appendChild(document.createTextNode(text.slice(last, m.index)));
      var k = document.createElement('mark');
      k.className = 'hl';
      k.textContent = m[1];
      node.appendChild(k);
      last = m.index + m[0].length;
    }
    if(last < text.length) node.appendChild(document.createTextNode(text.slice(last)));
    return node;
  }
  /* 会解析高亮的 el()。只给「我们自己写的」文字用——概述、观点、章节。
     引文和转写必须逐字，一律走 el()，否则原话里的 == 会被吃掉。 */
  function elh(tag, cls, text){
    var n = document.createElement(tag);
    if(cls) n.className = cls;
    if(text != null) fill(n, text);
    return n;
  }

  /* ---------- 夜间 / 白天 ---------- */
  (function(){
    var root = document.documentElement, btn = document.getElementById('theme');
    function paint(){
      var dark = root.getAttribute('data-theme') !== 'light';
      btn.textContent = dark ? '☀︎ 白天' : '☾ 夜晚';
      btn.setAttribute('aria-label', dark ? '切换到白天模式' : '切换到夜晚模式');
    }
    btn.addEventListener('click', function(){
      var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      root.setAttribute('data-theme', next);
      try{ localStorage.setItem('v2d-theme', next); }catch(e){}
      paint();
    });
    paint();
  })();
  function mmss(s){
    s = Math.max(0, Math.floor(s || 0));
    var h = Math.floor(s/3600), m = Math.floor(s/60)%60, x = s%60;
    var p = function(v){ return (v<10?'0':'') + v; };
    return h ? h + ':' + p(m) + ':' + p(x) : p(m) + ':' + p(x);
  }
  /* BiText：原文为主，中文译文跟在下面；原文本就是中文则只有一行 */
  function biInto(node, b, cls){
    if(!b) return node;
    if(b.en){
      node.appendChild(elh('div', cls || 'en', b.en));
      if(b.zh) node.appendChild(elh('div', 'zh', b.zh));
    } else if(b.zh){
      node.appendChild(elh('div', null, b.zh));
    }
    return node;
  }
  function pb(t){
    var b = el('button', 'pb', mmss(t));
    b.setAttribute('data-t', t);
    if(!hasAudio) b.setAttribute('disabled', 'disabled');
    return b;
  }

  /* ---------- 页头 ---------- */
  document.title = (M.short_title || M.title || '视频分析报告') + ' · 视频分析报告';
  document.getElementById('h-title').textContent = M.short_title || M.title || '视频分析报告';
  if(M.title && M.title !== M.short_title) document.getElementById('h-sub').textContent = M.title;
  var meta = document.getElementById('h-meta');
  function pill(label, value){
    if(!value) return;
    var p = el('span', 'pill', label + ' ');
    p.appendChild(el('b', null, value));
    meta.appendChild(p);
  }
  pill('▶ 平台', M.platform);
  pill('👤 UP主', M.uploader);
  pill('⏱ 时长', mmss(M.duration));
  pill('📅 发布', M.upload_date);
  pill('📝 字幕', M.source_label);
  pill('🌐 语言', isZh ? '中文' : (M.lang || '') + ' · 中英双语');

  /* ---------- 章节区间 → 找某个时间点属于哪一章 ---------- */
  var chapters = D.chapters || [];
  function chapterAt(t){
    var hit = null;
    for(var i=0;i<chapters.length;i++){
      if(t >= chapters[i].t_start - 0.5) hit = chapters[i]; else break;
    }
    return hit;
  }

  /* ---------- 章节结构 ---------- */
  var main = document.getElementById('main');
  var toc  = document.getElementById('toc');
  var idx  = 0;
  function section(id, title, count){
    var s = el('section');
    s.id = id;
    var h = el('h2');
    var n = (idx < 10 ? '0' : '') + idx;
    h.appendChild(el('span', 'idx', n));
    h.appendChild(el('span', null, title));
    s.appendChild(h);
    main.appendChild(s);

    var a = el('a');
    a.href = '#' + id;
    a.appendChild(el('span', 'n', n));
    a.appendChild(el('span', null, title));
    if(count) a.appendChild(el('span', 'score', count));
    toc.appendChild(a);

    idx++;
    return s;
  }
  function lead(s, text){ s.appendChild(el('p', 'lead', text)); return s; }

  /* ---------- 00 总览 ---------- */
  if(D.overview && (D.overview.zh || D.overview.en)){
    var s0 = section('overview', '总览与结论');
    var c = el('div', 'callout');
    biInto(c, D.overview);
    s0.appendChild(c);
    if((D.topics || []).length){
      var tw = el('div', 'topics');
      D.topics.forEach(function(t){ tw.appendChild(el('span', 'topic', '# ' + t)); });
      s0.appendChild(tw);
    }
    if((D.stats || []).length){
      var st = el('div', 'stats');
      D.stats.forEach(function(x){
        var w = el('div', 'stat');
        w.appendChild(el('div', 'num', x.value));
        w.appendChild(el('div', 'cap', x.label));
        st.appendChild(w);
      });
      s0.appendChild(st);
    }
  }

  /* ---------- 01 核心观点 ---------- */
  if((D.viewpoints || []).length){
    var s1 = section('viewpoints', '核心观点', D.viewpoints.length + ' 条');
    lead(s1, '每条观点都配了逐字原话与时间点，点 ▶ 直接跳到原片那一刻。');
    D.viewpoints.forEach(function(v, i){
      var card = el('div', 'card vp');
      var head = el('div', 'vphead');
      head.appendChild(el('span', 'n', (i+1 < 10 ? '0' : '') + (i+1)));
      var t = el('div', 't');
      biInto(t, v.title);
      head.appendChild(t);
      head.appendChild(pb(v.t));
      card.appendChild(head);
      var body = el('div', 'vpbody');
      biInto(body, v.detail);
      card.appendChild(body);
      if(v.quote){
        var q = el('div', 'quote');
        var qh = el('div', 'qhead');
        qh.appendChild(el('span', 'k', '原话'));
        qh.appendChild(pb(v.t));
        q.appendChild(qh);
        q.appendChild(el('div', isZh ? null : 'en', '「' + v.quote + '」'));
        if(v.quote_zh) q.appendChild(el('div', 'zh', v.quote_zh));
        card.appendChild(q);
      }
      s1.appendChild(card);
    });
  }

  /* ---------- 02 章节时间轴 ---------- */
  if(chapters.length){
    var s2 = section('timeline', '章节时间轴', chapters.length + ' 章');
    lead(s2, '全片结构速览。点任意时间跳转播放。');
    var card2 = el('div', 'card');
    var tl = el('div', 'tl');
    chapters.forEach(function(ch){
      var ev = el('div', 'ev');
      var h = el('div', 'h');
      h.appendChild(pb(ch.t_start));
      var ti = el('span');
      var title = (ch.title || {});
      fill(ti, title.en || title.zh || '');
      h.appendChild(ti);
      h.appendChild(el('span', 'rng', mmss(ch.t_start) + ' – ' + mmss(ch.t_end)));
      ev.appendChild(h);
      if(title.en && title.zh) ev.appendChild(elh('div', 'zh', title.zh));
      tl.appendChild(ev);
    });
    card2.appendChild(tl);
    s2.appendChild(card2);
  }

  /* ---------- 03 逐段精读 ---------- */
  if(chapters.length){
    var s3 = section('segments', '逐段精读', chapters.length + ' 段');
    lead(s3, '对着音频看：左侧时间戳可直接播放，右侧是这一段讲了什么、落在这一段的原话。');
    var card3 = el('div', 'card');
    chapters.forEach(function(ch){
      var seg = el('div', 'seg');
      var left = el('div', 'seg-t');
      left.appendChild(pb(ch.t_start));
      left.appendChild(el('span', 'rng', mmss(ch.t_start) + ' – ' + mmss(ch.t_end)));
      seg.appendChild(left);

      var right = el('div');
      var title = ch.title || {};
      var tp = elh('div', 'seg-topic', title.en || title.zh || '');
      right.appendChild(tp);
      if(title.en && title.zh) right.appendChild(elh('div', 'zh', title.zh));

      var row = el('div', 'seg-row');
      row.appendChild(el('span', 'k', '讲了什么：'));
      var sm = ch.summary || {};
      var body = el('span');
      if(sm.en){
        body.appendChild(elh('span', 'en', sm.en));
        if(sm.zh) body.appendChild(elh('div', 'zh', sm.zh));
      } else if(sm.zh){
        body.appendChild(elh('span', null, sm.zh));
      }
      row.appendChild(body);
      right.appendChild(row);

      /* 落在本段区间内的观点原话 */
      (D.viewpoints || []).forEach(function(v){
        if(!v.quote || v.t < ch.t_start || v.t >= ch.t_end) return;
        var q = el('div', 'seg-row q');
        q.appendChild(el('span', 'k', '原话：'));
        var sp = el('span', isZh ? null : 'en', '「' + v.quote + '」 ');
        q.appendChild(sp);
        q.appendChild(pb(v.t));
        if(v.quote_zh) q.appendChild(el('div', 'zh', v.quote_zh));
        right.appendChild(q);
      });

      seg.appendChild(right);
      card3.appendChild(seg);
    });
    s3.appendChild(card3);
  }

  /* ---------- 04 金句 ---------- */
  if((D.quotes || []).length){
    var s4 = section('quotes', '金句', D.quotes.length + ' 句');
    D.quotes.forEach(function(q){
      var g = el('div', 'gq');
      g.appendChild(el('div', 'big' + (isZh ? '' : ' en'), '“' + q.text + '”'));
      if(q.text_zh) g.appendChild(el('div', 'zh', q.text_zh));
      var f = el('div', 'foot');
      f.appendChild(pb(q.t));
      g.appendChild(f);
      s4.appendChild(g);
    });
  }

  /* ---------- 05 完整转写 ---------- */
  var rows = [];
  var lines = D.transcript || [];
  if(lines.length){
    var s5 = section('transcript', '完整转写', lines.length + ' 行');
    var bar = el('div', 'tsbar');
    var lab = el('label');
    var cb = el('input');
    cb.type = 'checkbox';
    cb.checked = true;
    cb.id = 'follow';
    lab.appendChild(cb);
    lab.appendChild(el('span', null, ' 跟随播放自动滚动'));
    bar.appendChild(lab);
    bar.appendChild(el('span', 'lead', isZh ? '点时间戳跳转播放。' : '原文在上、中文译文在下；点时间戳跳转播放。'));
    s5.appendChild(bar);

    var wrap = el('div', 'tswrap');
    lines.forEach(function(l){
      var r = el('div', 'row');
      var tm = el('div', 'tm', mmss(l.t0));
      tm.setAttribute('data-t', l.t0);
      r.appendChild(tm);
      var tx = el('div', 'tx');
      tx.appendChild(el('div', isZh ? null : 'en', l.text));
      if(l.zh) tx.appendChild(el('div', 'zh', l.zh));
      r.appendChild(tx);
      wrap.appendChild(r);
      rows.push(r);
    });
    s5.appendChild(wrap);
  }

  /* ---------- footer ---------- */
  var foot = document.getElementById('foot');
  var f1 = el('div', null, '由 video-to-doc-agent 生成' + (M.generated_at ? ' · ' + M.generated_at : '') + ' · ');
  if(M.url){
    var a = el('a', null, M.url);
    a.href = M.url;
    a.target = '_blank';
    a.rel = 'noopener';
    f1.appendChild(el('span', null, '原视频：'));
    f1.appendChild(a);
  }
  foot.appendChild(f1);
  foot.appendChild(el('div', null,
    '观点与章节由模型基于' + (M.source_label || '转写文本') + '归纳，时间戳取自转写行，可能有少量偏移；引用请以原片为准。'));

  /* ---------- 目录高亮 ---------- */
  (function(){
    var links = [].slice.call(document.querySelectorAll('.toc a'));
    var pairs = links.map(function(a){
      var s = document.querySelector(a.getAttribute('href'));
      return s ? [s, a] : null;
    }).filter(Boolean);
    if(!('IntersectionObserver' in window) || !pairs.length) return;
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){
        if(!e.isIntersecting) return;
        links.forEach(function(l){ l.classList.remove('active'); });
        for(var i=0;i<pairs.length;i++){
          if(pairs[i][0] === e.target){ pairs[i][1].classList.add('active'); break; }
        }
      });
    }, {rootMargin:'-8% 0px -78% 0px'});
    pairs.forEach(function(p){ io.observe(p[0]); });
  })();

  /* ---------- 播放器 ---------- */
  var au = document.getElementById('au');
  var barEl = document.getElementById('playerbar');
  var capbar = document.getElementById('capbar');
  if(!hasAudio){
    barEl.style.display = 'none';
    capbar.style.display = 'none';
    return;
  }
  au.src = D.audio;
  document.getElementById('pt-name').textContent = (M.short_title || D.audio) + ' · ' + D.audio;

  /* 点任意 ▶ / 时间戳 → 跳转播放 */
  document.addEventListener('click', function(e){
    var b = e.target.closest('.pb, .row .tm');
    if(!b) return;
    var t = parseFloat(b.getAttribute('data-t'));
    if(isNaN(t)) return;
    au.currentTime = t;
    au.play();
    var old = document.querySelectorAll('.pb.playing');
    for(var i=0;i<old.length;i++) old[i].classList.remove('playing');
    if(b.classList.contains('pb')) b.classList.add('playing');
  });

  /* 实时字幕 + 转写高亮跟随 */
  var cap = document.getElementById('cap');
  var ccb = document.getElementById('cc');
  var on = true, lastCue = -1, lastRow = -1;
  try{ if(localStorage.getItem('v2d-cc') === '0') on = false; }catch(e){}

  function findLine(t){
    /* 先看上一次命中的附近，miss 再二分 */
    if(lastCue >= 0 && lines[lastCue] && t >= lines[lastCue].t0 && t < lines[lastCue].t1) return lastCue;
    var lo = 0, hi = lines.length - 1, ans = -1;
    while(lo <= hi){
      var m = (lo + hi) >> 1;
      if(t < lines[m].t0) hi = m - 1;
      else { ans = m; lo = m + 1; }
    }
    return ans;
  }
  function paintCap(i){
    cap.textContent = '';
    if(!on || i < 0) return;
    var l = lines[i];
    var head = el('span', 'cts', mmss(l.t0));
    cap.appendChild(head);
    cap.appendChild(document.createTextNode(l.text));
    if(l.zh) cap.appendChild(el('div', 'zh', l.zh));
  }
  function tick(){
    var i = findLine(au.currentTime);
    if(i === lastCue) return;
    lastCue = i;
    paintCap(i);
    if(i !== lastRow && rows[i]){
      if(rows[lastRow]) rows[lastRow].classList.remove('active');
      rows[i].classList.add('active');
      lastRow = i;
      var f = document.getElementById('follow');
      if(f && f.checked) rows[i].scrollIntoView({block:'nearest', behavior:'smooth'});
    }
  }
  function applyCC(){
    capbar.classList.toggle('on', on);
    ccb.setAttribute('aria-pressed', on ? 'true' : 'false');
    ccb.querySelector('.lbl').textContent = on ? '字幕 开' : '字幕 关';
    if(!on) cap.textContent = ''; else paintCap(lastCue);
    try{ localStorage.setItem('v2d-cc', on ? '1' : '0'); }catch(e){}
  }
  ccb.addEventListener('click', function(){ on = !on; applyCC(); });
  au.addEventListener('timeupdate', tick);
  au.addEventListener('seeked', function(){ lastCue = -1; tick(); });
  applyCC();
})();
</script>
</body>
</html>
