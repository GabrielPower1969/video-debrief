<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视频分析报告</title>
<style>
  :root {
    --bg: #f7f7f8;
    --surface: #ffffff;
    --ink: #1a1a21;
    --ink-2: #4b4b57;
    --muted: #8a8a96;
    --line: #e6e6ea;
    --accent: #4f46e5;
    --accent-ink: #ffffff;
    --accent-soft: #eef0fe;
    --quote-bg: #fafafb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131318;
      --surface: #1c1c24;
      --ink: #ececf1;
      --ink-2: #b6b6c2;
      --muted: #7c7c8a;
      --line: #2d2d38;
      --accent: #8b85f4;
      --accent-ink: #16161d;
      --accent-soft: #26263a;
      --quote-bg: #21212b;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.75 -apple-system, "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 40px 20px 72px; }

  /* ---- hero ---- */
  .kicker { color: var(--muted); font-size: 13px; letter-spacing: .04em; }
  h1 { font-size: 30px; line-height: 1.3; margin: 8px 0 4px; letter-spacing: -.01em; }
  .orig-title { color: var(--ink-2); font-size: 14px; margin-bottom: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 20px; }
  .chip {
    font-size: 12.5px; color: var(--ink-2); background: var(--surface);
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px;
  }
  .overview { font-size: 15.5px; color: var(--ink-2); max-width: 72ch; }
  .overview .zh-sub { display: block; margin-top: 8px; }
  .topics { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .topic {
    font-size: 12.5px; color: var(--accent); background: var(--accent-soft);
    border-radius: 999px; padding: 3px 12px; font-weight: 500;
  }

  /* ---- stat tiles（数字用正文墨色，不上彩） ---- */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
           gap: 12px; margin: 28px 0 8px; }
  .stat { background: var(--surface); border: 1px solid var(--line);
          border-radius: 14px; padding: 14px 18px; }
  .stat .label { font-size: 12px; color: var(--muted); letter-spacing: .05em; }
  .stat .value { font-size: 26px; font-weight: 650; letter-spacing: -.01em;
                 font-variant-numeric: tabular-nums; margin-top: 2px; }

  /* ---- sticky player ---- */
  .player { position: sticky; top: 10px; z-index: 50; margin: 22px 0 6px;
            background: var(--surface); border: 1px solid var(--line);
            border-radius: 16px; padding: 12px 16px 10px;
            box-shadow: 0 6px 24px rgba(0,0,0,.08); }
  .player audio { width: 100%; height: 38px; display: block; }
  .player .now { font-size: 12.5px; color: var(--muted); margin-top: 6px;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player .now b { color: var(--accent); font-weight: 600; }
  .player.hidden { display: none; }

  /* ---- sections ---- */
  section { margin-top: 44px; }
  h2 { font-size: 20px; letter-spacing: -.01em; display: flex; align-items: baseline; gap: 10px; }
  h2 .count { font-size: 13px; color: var(--muted); font-weight: 400; }

  /* ---- 播放按钮 / 时间胶囊 ---- */
  .tchip {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    font: 600 12.5px/1 ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--accent); background: var(--accent-soft);
    border: none; border-radius: 999px; padding: 6px 12px;
    transition: transform .06s ease;
    font-variant-numeric: tabular-nums;
  }
  .tchip:hover { transform: scale(1.05); }
  .tchip:active { transform: scale(.97); }
  .tchip .tri { font-size: 10px; }
  body.no-audio .tchip { cursor: default; color: var(--muted); background: var(--quote-bg); }
  body.no-audio .tchip:hover { transform: none; }

  /* ---- 核心观点 ---- */
  .vp { background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
        padding: 20px 22px; margin-top: 14px; }
  .vp-head { display: flex; gap: 12px; align-items: flex-start; }
  .vp-num { flex: none; width: 26px; height: 26px; border-radius: 8px;
            background: var(--accent); color: var(--accent-ink);
            font: 700 13px/26px sans-serif; text-align: center; margin-top: 2px; }
  .vp-title { font-size: 16.5px; font-weight: 650; }
  .vp-title .zh-sub { display: block; font-size: 14px; font-weight: 500; color: var(--ink-2); }
  .vp-detail { color: var(--ink-2); margin: 10px 0 12px; }
  .vp-detail .zh-sub { display: block; margin-top: 6px; }
  .quote-box { background: var(--quote-bg); border-left: 3px solid var(--accent);
               border-radius: 0 10px 10px 0; padding: 10px 14px;
               display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
  .quote-box .q { font-size: 14px; color: var(--ink-2); font-style: italic; }
  .quote-box .q .zh-sub { display: block; font-style: normal; margin-top: 4px; color: var(--muted); }
  .quote-box .tchip { flex: none; margin-top: 2px; }

  /* ---- 章节时间轴 ---- */
  .timeline { margin-top: 18px; padding-left: 18px; border-left: 2px solid var(--line); }
  .ch { position: relative; padding: 2px 0 26px 18px; }
  .ch::before { content: ""; position: absolute; left: -24px; top: 10px;
                width: 10px; height: 10px; border-radius: 50%;
                background: var(--accent); border: 2px solid var(--bg); }
  .ch-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .ch-title { font-size: 15.5px; font-weight: 650; }
  .ch-title .zh-sub { font-weight: 500; color: var(--ink-2); margin-left: 8px; }
  .ch-range { font: 500 12px/1 ui-monospace, monospace; color: var(--muted); }
  .ch-sum { color: var(--ink-2); margin-top: 6px; max-width: 68ch; }
  .ch-sum .zh-sub { display: block; margin-top: 4px; }

  /* ---- 金句 ---- */
  .quotes { display: grid; gap: 12px; margin-top: 16px; }
  .gq { background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
        padding: 16px 20px; }
  .gq .mark { color: var(--accent); font-size: 22px; font-family: Georgia, serif; line-height: 1; }
  .gq .q { font-size: 15px; margin: 4px 0 10px; }
  .gq .q .zh-sub { display: block; font-size: 13.5px; color: var(--muted); margin-top: 4px; }

  /* ---- 转写 ---- */
  .tr-controls { display: flex; align-items: center; gap: 14px; margin: 14px 0 10px;
                 font-size: 13px; color: var(--muted); }
  .tr-controls label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .transcript { background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
                max-height: 500px; overflow-y: auto; padding: 6px 0; }
  .row { display: flex; gap: 14px; padding: 8px 18px; border-left: 3px solid transparent; }
  .row.active { background: var(--accent-soft); border-left-color: var(--accent); }
  .row .t { flex: none; font: 500 12px/1.9 ui-monospace, monospace; color: var(--muted);
            cursor: pointer; font-variant-numeric: tabular-nums; }
  .row .t:hover { color: var(--accent); }
  body.no-audio .row .t { cursor: default; }
  body.no-audio .row .t:hover { color: var(--muted); }
  .row .tx { flex: 1; }
  .row .tx .zh-sub { display: block; font-size: 13px; color: var(--muted); }

  footer { margin-top: 56px; color: var(--muted); font-size: 12.5px;
           border-top: 1px solid var(--line); padding-top: 16px; }
  footer a { color: var(--muted); }

  @media (max-width: 560px) {
    h1 { font-size: 24px; }
    .quote-box { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
    <div class="orig-title" id="origTitle"></div>
    <div class="chips" id="chips"></div>
    <p class="overview" id="overview"></p>
    <div class="topics" id="topics"></div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="player" id="player">
    <audio id="audio" controls preload="metadata"></audio>
    <div class="now" id="now">点击任意 ▶ 时间戳，跳转到对应片段播放</div>
  </div>

  <section id="sec-viewpoints">
    <h2>核心观点 <span class="count" id="vpCount"></span></h2>
    <div id="viewpoints"></div>
  </section>

  <section id="sec-chapters">
    <h2>章节时间轴 <span class="count" id="chCount"></span></h2>
    <div class="timeline" id="chapters"></div>
  </section>

  <section id="sec-quotes">
    <h2>金句</h2>
    <div class="quotes" id="quotes"></div>
  </section>

  <section id="sec-transcript">
    <h2>完整转写 <span class="count" id="trCount"></span></h2>
    <div class="tr-controls">
      <label><input type="checkbox" id="follow" checked> 跟随播放自动滚动</label>
    </div>
    <div class="transcript" id="transcript"></div>
  </section>

  <footer id="footer"></footer>
</div>

<script>
window.REPORT_DATA = /*__REPORT_DATA__*/null;
</script>
<script>
(function () {
  const D = window.REPORT_DATA;
  if (!D) { document.body.textContent = "REPORT_DATA 未注入"; return; }

  // ---------- 小工具 ----------
  const $ = (id) => document.getElementById(id);
  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;   // textContent：天然防注入
    return n;
  }
  function mmss(t) {
    t = Math.max(0, Math.floor(t));
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    const p = (n) => String(n).padStart(2, "0");
    return h ? `${h}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`;
  }
  // BiText → 主行 + 副行（原文非中文：原文为主、中文为副；原文中文：只有主行）
  function biInto(parent, bi) {
    if (!bi) return;
    if (bi.en) {
      parent.appendChild(document.createTextNode(bi.en));
      if (bi.zh) parent.appendChild(el("span", "zh-sub", bi.zh));
    } else {
      parent.appendChild(document.createTextNode(bi.zh || ""));
    }
  }

  // ---------- 播放器 ----------
  const audio = $("audio");
  const hasAudio = !!D.audio;
  if (hasAudio) { audio.src = D.audio; } else {
    $("player").classList.add("hidden");
    document.body.classList.add("no-audio");
  }
  function seek(t) {
    if (!hasAudio) return;
    audio.currentTime = t;
    audio.play();
  }
  function tchip(t) {
    const b = el("button", "tchip");
    b.appendChild(el("span", "tri", "▶"));
    b.appendChild(document.createTextNode(mmss(t)));
    b.dataset.t = t;
    b.addEventListener("click", () => seek(t));
    return b;
  }

  // ---------- hero ----------
  const M = D.meta || {};
  $("kicker").textContent = [M.platform, M.uploader, M.upload_date].filter(Boolean).join(" · ");
  $("title").textContent = M.short_title || M.title || "视频分析报告";
  $("origTitle").textContent = (M.short_title && M.title && M.short_title !== M.title) ? M.title : "";
  document.title = (M.short_title || M.title || "视频分析报告") + " · 视频分析报告";

  const chips = $("chips");
  const langLabel = M.lang === "zh" ? "中文" : (M.lang ? `${M.lang} · 中英双语` : "");
  [M.duration ? `时长 ${mmss(M.duration)}` : "", langLabel,
   M.source_label || ""].filter(Boolean).forEach((c) => chips.appendChild(el("span", "chip", c)));

  biInto($("overview"), D.overview);
  (D.topics || []).forEach((t) => $("topics").appendChild(el("span", "topic", "# " + t)));

  // ---------- stat tiles ----------
  (D.stats || []).forEach((s) => {
    const tile = el("div", "stat");
    tile.appendChild(el("div", "label", s.label));
    tile.appendChild(el("div", "value", s.value));
    $("stats").appendChild(tile);
  });

  // ---------- 核心观点 ----------
  const vps = D.viewpoints || [];
  $("vpCount").textContent = vps.length ? `${vps.length} 条` : "";
  vps.forEach((v, i) => {
    const card = el("div", "vp");
    const head = el("div", "vp-head");
    head.appendChild(el("div", "vp-num", String(i + 1)));
    const tt = el("div", "vp-title"); biInto(tt, v.title); head.appendChild(tt);
    card.appendChild(head);
    const detail = el("div", "vp-detail"); biInto(detail, v.detail); card.appendChild(detail);
    if (v.quote) {
      const qb = el("div", "quote-box");
      const q = el("div", "q");
      q.appendChild(document.createTextNode("“" + v.quote + "”"));
      if (v.quote_zh) q.appendChild(el("span", "zh-sub", v.quote_zh));
      qb.appendChild(q);
      qb.appendChild(tchip(v.t || 0));
      card.appendChild(qb);
    }
    $("viewpoints").appendChild(card);
  });
  if (!vps.length) $("sec-viewpoints").style.display = "none";

  // ---------- 章节时间轴 ----------
  const chs = D.chapters || [];
  $("chCount").textContent = chs.length ? `${chs.length} 章` : "";
  chs.forEach((c) => {
    const item = el("div", "ch");
    const head = el("div", "ch-head");
    head.appendChild(tchip(c.t_start));
    head.appendChild(el("span", "ch-range", `${mmss(c.t_start)} – ${mmss(c.t_end)}`));
    const tt = el("span", "ch-title"); biInto(tt, c.title); head.appendChild(tt);
    item.appendChild(head);
    const sum = el("div", "ch-sum"); biInto(sum, c.summary); item.appendChild(sum);
    $("chapters").appendChild(item);
  });
  if (!chs.length) $("sec-chapters").style.display = "none";

  // ---------- 金句 ----------
  const qs = D.quotes || [];
  qs.forEach((q) => {
    const g = el("div", "gq");
    g.appendChild(el("div", "mark", "❝"));
    const body = el("div", "q");
    body.appendChild(document.createTextNode(q.text));
    if (q.text_zh) body.appendChild(el("span", "zh-sub", q.text_zh));
    g.appendChild(body);
    g.appendChild(tchip(q.t || 0));
    $("quotes").appendChild(g);
  });
  if (!qs.length) $("sec-quotes").style.display = "none";

  // ---------- 完整转写 ----------
  const tr = D.transcript || [];
  $("trCount").textContent = tr.length ? `${tr.length} 行` : "";
  const trBox = $("transcript");
  const rowEls = tr.map((l) => {
    const row = el("div", "row");
    const t = el("span", "t", mmss(l.t0));
    t.addEventListener("click", () => seek(l.t0));
    row.appendChild(t);
    const tx = el("span", "tx");
    tx.appendChild(document.createTextNode(l.text));
    if (l.zh) tx.appendChild(el("span", "zh-sub", l.zh));
    row.appendChild(tx);
    trBox.appendChild(row);
    return row;
  });
  if (!tr.length) $("sec-transcript").style.display = "none";

  // ---------- 播放联动：高亮当前行 + 当前章节 ----------
  let activeIdx = -1;
  function chapterAt(t) {
    for (let i = chs.length - 1; i >= 0; i--) if (t >= chs[i].t_start) return chs[i];
    return null;
  }
  audio.addEventListener("timeupdate", () => {
    const t = audio.currentTime;
    // 当前章节
    const ch = chapterAt(t);
    if (ch) {
      const name = ch.title.en || ch.title.zh || "";
      $("now").innerHTML = "";
      $("now").appendChild(document.createTextNode("正在播放：" + mmss(t) + " · "));
      $("now").appendChild(el("b", null, name));
    }
    // 当前转写行（转写有序，线性推进即可）
    let idx = activeIdx;
    if (idx < 0 || t < (tr[idx] ? tr[idx].t0 : 0)) idx = 0;
    while (idx + 1 < tr.length && tr[idx + 1].t0 <= t) idx++;
    if (idx !== activeIdx && tr[idx]) {
      if (rowEls[activeIdx]) rowEls[activeIdx].classList.remove("active");
      rowEls[idx].classList.add("active");
      activeIdx = idx;
      if ($("follow").checked)
        rowEls[idx].scrollIntoView({ block: "center", behavior: "smooth" });
    }
  });

  // ---------- footer ----------
  const f = $("footer");
  f.appendChild(document.createTextNode("由 video-to-doc-agent 生成"
    + (M.generated_at ? " · " + M.generated_at : "") + " · 原视频："));
  const a = el("a", null, M.url || "-");
  a.href = M.url || "#"; a.target = "_blank"; a.rel = "noopener";
  f.appendChild(a);
})();
</script>
</body>
</html>
